[package]
name = "core-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared JSON-RPC 2.0 types and stdio transport for MCP servers."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "io-std", "rt"], optional = true }

[features]
default = []
async-stdio = ["tokio"]

[lints]
workspace = true
