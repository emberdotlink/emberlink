[package]
name = "ember-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The trust layer for AI agents — daemon process for credential mediation, policy enforcement, and agent management"
repository = "https://github.com/emberdotlink/emberlink"
homepage = "https://ember.link"
keywords = ["agent", "trust", "daemon", "credentials", "security"]
categories = ["authentication", "command-line-utilities"]
publish = false

[features]
# implementation-note-73: age keypair generation for SOPS+emberd integration.
# On by default — implementation-note-73 ships persona age keys as a first-class
# daemon capability. Build with `--no-default-features` to opt out for
# environments that explicitly don't want the age dep linked.
#
# implementation-note-74: webauthn enables server-side passkey ceremony
# (registration + authentication) so dashboard approvals are gated by
# a verified WebAuthn assertion against a stored credential pubkey.
# Default-on: the gate fails closed by default. Build with
# `--no-default-features` for environments that explicitly opt out.
default = ["age", "webauthn", "se-real"]
age = ["dep:age"]
webauthn = ["dep:webauthn-rs"]

# implementation-note-45-: gates the real Secure-Enclave wrap/unwrap
# path in `install::provision_se_mek` (write side) and
# `infra::vault_macos_se::get_mek_passphrase` (read side, transitively via
# `ember_broker::secure_enclave::se_unwrap`). On by default so the daemon
# binary ships with the SE path live on macOS; on Linux the feature is inert
# because `ember-broker`'s `secure_enclave.rs` is `#![cfg(target_os = "macos")]`.
se-real = ["ember-broker/se-real"]

# implementation-note-5 (Cluster D D1, design review 20260513-122447):
# Workspace test-substrate exposure. Off by default; enabled by tests +
# staging builds that need MockBroker, mock fixtures, etc. The build.rs
# refuses to compile when this is enabled together with EMBER_RELEASE=1,
# so release artifacts can never accidentally carry test scaffolding.
# Production checkpoint approaches were rejected (runtime-deletable);
# cfg!(debug_assertions) handles the always-test case, qa-mock handles
# "I need test helpers in a release build for staging."
qa-mock = []

[dependencies]
age = { version = "0.11", optional = true, features = ["armor"] }
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
# AWS SigV4 signing for Vault AWS IAM auth (implementation-note-75).
# Used by `infra::credential_store::hashicorp_vault::vault_aws_login`
# to sign a `sts:GetCallerIdentity` request that Vault re-plays
# server-side as proof of the daemon's AWS IAM identity. Already
# arrives transitively via `ember-broker`'s aws_sts module; declared
# here to make the daemon-level usage explicit and stable.
aws-credential-types = "1"
aws-sigv4 = "1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
core-approval = { path = "../core-approval" }
core-broker = { path = "../core-broker" }
ember-broker = { path = "../ember-broker" }
core-state = { path = "../core-state" }
core-crypto = { path = "../core-crypto" }
core-construct-runtime = { path = "../core-construct-runtime" }
core-events = { path = "../core-events" }
core-grants = { path = "../core-grants" }
core-kms = { path = "../core-kms" }
core-proxy-forward = { path = "../core-proxy-forward" }
core-types = { path = "../core-types" }
core-principals = { path = "../core-principals" }
core-event-types = { path = "../core-event-types" }
core-grant-types = { path = "../core-grant-types" }
ember-construct = { path = "../ember-construct" }
# implementation-note-76 — emberd-side SpawnDirective
# sender shares the `ExecFrame` / `SpawnDirective` wire types with the
# in-container `ember-exec` receiver. The dep is acyclic: ember-exec
# (a leaf binary + thin lib) does not depend back on ember-daemon.
ember-exec = { path = "../ember-exec" }
# implementation-note-14 — the `headless_preflight_gaps` socket
# method delegates to headless-runtime's `recent_gaps_for_persona` reader,
# which owns the `.ember/runtime/permission-gaps.jsonl` log. The dep
# is acyclic — headless-runtime does not depend on ember-daemon.
dirs-next = "2"
ed25519-dalek = "2.1.1"
hex = "0.4"
sha2.workspace = true
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
# implementation-note-77 Phase 1 — memfd_create + F_ADD_SEALS
# via nix for the Linux-only credential-seal path in `broker/exec_env.rs`.
# `fs` feature enables `SealFlag` / `F_ADD_SEALS` (Linux + FreeBSD-gated).
# Pinned to 0.29 to match the workspace's existing nix transitive (via
# ember-exec) and avoid a duplicate compile.
# `process` feature pulls in `fork`/`waitpid`/`ForkResult`/`WaitStatus` used
# by `install::provision_se_mek` to drop to the `ember` system uid before
# touching the Secure Enclave (so the SE key lands in ember's per-user
# DataProtectionKeychain context, where the launchd-spawned daemon also
# running as ember can read it back).
nix = { version = "0.29", features = ["fs", "process", "user"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.16"
webpki-roots = "1.0"
# Use `getrandom` directly for byte-fill ops in vault and dashboard.
# The `rand` crate is no longer needed since its 0.9/0.10 API reorg moved
# `RngCore`/`fill_bytes`/`sample_iter` behind extension traits; `getrandom`
# gives us what we actually use (OS entropy into a buffer) with a stable
# API surface.
getrandom = "0.4"
percent-encoding = "2"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# tracing-subscriber is also listed in dev-dependencies for tests; we need it
# in regular deps so the `emberd` binary (src/bin/emberd.rs) can initialize a
# subscriber under LaunchDaemon/systemd where no parent process does. Cargo
# deduplicates — the same crate with the same features compiles once.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml.workspace = true
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
aho-corasick = "1"
once_cell = "1"
regex = "1"
zeroize = { version = "1", features = ["derive"] }
# implementation-note-74: WebAuthn relying-party. Verifies passkey
# registration + authentication ceremonies against stored credential
# pubkeys. Sync API (no Send/async surprises in our LocalSet model).
# `resident-key-support` feature so the dashboard can authenticate
# against discoverable platform passkeys (TouchID on macOS).
#
# Features:
# - resident-key-support: dashboard authenticates against discoverable
#   platform passkeys (TouchID on macOS) without a stored credential ID.
# - danger-allow-state-serialisation: serialize PasskeyRegistration /
#   PasskeyAuthentication state to SQLite between begin/finish. The
#   "danger" prefix flags the requirement that the storage be private
#   to the daemon; our `webauthn_challenges` table lives in the
#   daemon's local-only SQLite database, never replicated.
webauthn-rs = { version = "0.5", features = ["resident-key-support", "danger-allow-state-serialisation"], optional = true }

# implementation-note-78: macOS biometric+passcode gate. The
# `keyring` crate (already a dep above) does not expose
# `kSecAttrAccessControl`, so we drop down to `security-framework` directly
# on macOS to wrap the vault MEK with
# `kSecAccessControlBiometryAny | kSecAccessControlOr | kSecAccessControlDevicePasscode`
# (Touch ID / Face ID, with device passcode fallback). Pinned to v3 (same
# major already present transitively via keyring's `apple-native` feature)
# to avoid a duplicate compile of v2.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
emberlink-agent = { path = "../emberlink-agent" }
hex = "0.4"
tempfile = "3"
# `test-util` enables `tokio::time::{pause, advance, resume}` for deterministic
# wall-clock control in the P69L.0b--TIMEOUTS regression tests. Dev-only;
# the `features` list is additive with the root `features = ["full"]`.
tokio = { version = "1", features = ["test-util"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "emberd"
path = "src/bin/emberd.rs"

