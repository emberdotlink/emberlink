[package]
name = "ember-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The trust layer for AI agents — daemon process for credential mediation, policy enforcement, and agent management"
repository = "https://github.com/emberdotlink/emberlink"
homepage = "https://ember.link"
keywords = ["agent", "trust", "daemon", "credentials", "security"]
categories = ["authentication", "command-line-utilities"]

[dependencies]
argon2 = "0.5"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
core-broker = { path = "../core-broker" }
core-crypto = { path = "../core-crypto" }
core-kms = { path = "../core-kms" }
core-types = { path = "../core-types" }
dirs-next = "2"
ed25519-dalek = "2.1.1"
hex = "0.4"
sha2.workspace = true
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "1.0"
# Use `getrandom` directly for byte-fill ops in vault and dashboard.
# The `rand` crate is no longer needed since its 0.9/0.10 API reorg moved
# `RngCore`/`fill_bytes`/`sample_iter` behind extension traits; `getrandom`
# gives us what we actually use (OS entropy into a buffer) with a stable
# API surface.
getrandom = "0.4"
percent-encoding = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml.workspace = true
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
aho-corasick = "1"
once_cell = "1"
regex = "1"
zeroize = { version = "1", features = ["derive"] }

# security check: macOS user-presence gate. The `keyring` crate (already a dep above)
# does not expose `kSecAttrAccessControl`, so we drop down to
# `security-framework` directly on macOS to wrap the vault MEK with
# `kSecAccessControlUserPresence` (Touch ID / device passcode).
# Pinned to v3 (same major already present transitively via keyring's
# `apple-native` feature) to avoid a duplicate compile of v2.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
emberlink-agent = { path = "../emberlink-agent" }
hex = "0.4"
tempfile = "3"
# `test-util` enables `tokio::time::{pause, advance, resume}` for deterministic
# wall-clock control in the P69L.0b--TIMEOUTS regression tests. Dev-only;
# the `features` list is additive with the root `features = ["full"]`.
tokio = { version = "1", features = ["test-util"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

