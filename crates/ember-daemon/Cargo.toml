[package]
name = "ember-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The trust layer for AI agents — daemon process for credential mediation, policy enforcement, and agent management"
repository = "https://github.com/emberdotlink/emberlink"
homepage = "https://ember.link"
keywords = ["agent", "trust", "daemon", "credentials", "security"]
categories = ["authentication", "command-line-utilities"]
publish = false
autotests = false

[dependencies]
base64 = "0.22"
ember-authority = { path = "../ember-authority" }
serde_jcs = "0.2"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "emberd"
path = "src/bin/emberd.rs"

[[test]]
name = "productbase_s4_runtime"
path = "tests/productbase_s4_runtime.rs"

[dev-dependencies]
core-crypto = { path = "../core-crypto" }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
hex = "=0.4.3"
tempfile = "=3.27.0"

[lints]
workspace = true
