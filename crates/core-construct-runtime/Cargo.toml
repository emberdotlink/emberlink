[package]
name = "core-construct-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared per-Construct runtime boilerplate: env-detect → classify → broker.resolve → broker.exec → ExitCode (per design)"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
toml.workspace = true
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
