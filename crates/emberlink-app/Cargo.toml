[package]
name = "emberlink-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# No tauri / keyring / dirs_next deps — those stay in application shells.
# Callers supply content_key and paths explicitly.
[dependencies]
core-crypto  = { path = "../core-crypto" }
core-eventlog = { path = "../core-eventlog" }
core-events  = { path = "../core-events" }
core-identity = { path = "../core-identity" }
core-personas = { path = "../core-personas" }
core-state   = { path = "../core-state" }
core-trust   = { path = "../core-trust" }
core-types   = { path = "../core-types" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next  = "2"
