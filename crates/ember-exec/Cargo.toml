[package]
name = "ember-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone pty-bridge spike: spawn a process with a full TTY, route stdin/stdout/stderr over a UDS, propagate SIGWINCH and exit codes."
repository = "https://github.com/emberdotlink/emberlink"
publish = false

[lib]
name = "ember_exec"
path = "src/lib.rs"

# implementation-note-367: production-shape binary target alongside the
# spike library. The bin owns the CLI + UDS accept loop; the lib retains
# the PtyBridge spike for the spawn-integration subtask (C) to wire in.
[[bin]]
name = "ember-exec"
path = "src/main.rs"

[dependencies]
# implementation-note-368: blake3 for the content-hash gate;
# nix for `setresuid` / `setresgid` privilege drop.
blake3 = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.29", features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "net", "io-util", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "net", "io-util", "sync", "time", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
