# CLASSIFICATION: PUBLIC
# P24 kubectl construct-factory fixture skeleton.

[[fixtures]]
name = "version-client-credentialless"
argv = ["version", "--client"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-kubectl/kubectl.read@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "client-only inspection must not inherit kubeconfig"

[[fixtures]]
name = "apply-file-needs-payload-analysis"
argv = ["apply", "-f", "deployment.yaml"]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "Kubernetes manifest can carry resources, subjects, roles, and namespace mutations"

[[fixtures]]
name = "delete-pod-implicit-context-needs-resolver"
argv = ["delete", "pod", "web"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "context, cluster, namespace, and API resource identity are implicit"

[[fixtures]]
name = "explicit-kubeconfig-fails-closed"
argv = ["--kubeconfig", "prod.kubeconfig", "delete", "pod", "web"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "kubeconfig selects credential source and target authority"
