# P24 gcloud construct-factory fixture skeleton.

[[fixtures]]
name = "version-credentialless"
argv = ["version"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-gcloud/gcloud.version@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "local CLI version inspection must not inherit Google credentials"

[[fixtures]]
name = "storage-rm-needs-resolver"
argv = ["storage", "rm", "gs://assets/releases/app.tar.gz"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "project/account and bucket authority must be resolved before projection exists"

[[fixtures]]
name = "iam-policy-file-needs-payload-analysis"
