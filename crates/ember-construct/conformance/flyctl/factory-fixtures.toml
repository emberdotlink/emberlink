# CLASSIFICATION: PUBLIC
# P24 flyctl construct-factory fixture skeleton.

[[fixtures]]
name = "version-credentialless"
argv = ["version"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-flyctl/fly.version@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "local CLI version inspection must not inherit Fly credentials"

[[fixtures]]
name = "apps-destroy-needs-resolver"
argv = ["apps", "destroy", "prod-app"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "app/org identity and token authority must be resolved before projection exists"

[[fixtures]]
name = "deploy-needs-payload-analysis"
argv = ["deploy", "--config", "fly.toml"]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "deployment config and Dockerfile can carry service, region, secret, and image authority"

[[fixtures]]
name = "access-token-flag-fails-closed"
