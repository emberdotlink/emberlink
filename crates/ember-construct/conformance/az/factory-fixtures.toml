# CLASSIFICATION: PUBLIC
# P24 Azure CLI construct-factory fixture skeleton.

[[fixtures]]
name = "version-credentialless"
argv = ["version"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-az/az.version@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "local CLI version inspection must not inherit Azure credentials"

[[fixtures]]
name = "vm-delete-needs-resolver"
argv = ["vm", "delete", "--name", "web-01", "--resource-group", "prod"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "subscription, tenant, and resource id must be resolved before need can be checked"

[[fixtures]]
name = "deployment-template-needs-payload-analysis"
argv = ["deployment", "group", "create", "--resource-group", "prod", "--template-file", "main.bicep"]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "ARM/Bicep payload can create or mutate resources beyond the group name"

[[fixtures]]
name = "subscription-global-fails-closed"
argv = ["--subscription", "prod-sub", "vm", "delete", "--name", "web-01", "--resource-group", "prod"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "subscription selector changes target and credential authority"

[[fixtures]]
name = "login-fails-closed"
argv = ["login"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "interactive credential-source mutation is outside the factory mediation contract"

[[fixtures]]
name = "vm-list-credentialless"
argv = ["vm", "list"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-az/az.vm.list@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "read-only list is a passthrough — no broker mediation needed"

[[fixtures]]
name = "webapp-deploy-with-template-needs-payload"
argv = ["webapp", "deploy", "--resource-group", "prod", "--template-file", "deploy.json"]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "ARM/Bicep template payload can create or mutate resources beyond the declared verb"
