# --- PayloadAnalysisRequired: authority-bearing payloads ---

[[fixtures]]
name = "build-context-needs-payload-analysis"
argv = ["build", "-t", "registry.example.com/app:latest", "."]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "Dockerfile, build context, and base image pulls are authority-bearing payload evidence"

[[fixtures]]
name = "run-needs-payload-analysis"
argv = ["run", "--rm", "alpine", "echo", "hi"]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "container runtime may pull images and mount volumes — payload must be analyzed"

[[fixtures]]
name = "pull-needs-payload-analysis"
argv = ["pull", "alpine:3.18"]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "public vs private registry cannot be determined at classification time"

# --- UnsupportedFailClosed: credential escapes ---

[[fixtures]]
name = "privileged-run-fails-closed"
argv = ["run", "--privileged", "--pid=host", "alpine"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "host-privileged runtime escape is outside the construct factory contract"

[[fixtures]]
name = "login-fails-closed"
argv = ["login", "ghcr.io"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "docker login is a credential escape vector — registry auth must be brokered"

[[fixtures]]
name = "logout-fails-closed"
argv = ["logout"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "docker logout is a credential management vector"

# --- ResolverRequired: needs unbuilt registry credential resolver ---

[[fixtures]]
name = "push-resolver-required"
argv = ["push", "myuser/myimage:latest"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "factory knows target but cannot mint registry credentials — resolver unbuilt"
