# CLASSIFICATION: PUBLIC
# P24 Docker construct-factory conformance corpus.

# --- Credentialless: local read-only operations ---

[[fixtures]]
name = "images-local-credentialless"
argv = ["images", "--format", "{{.Repository}}:{{.Tag}}"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-docker/docker.images@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "local image listing must not inherit registry credentials"

[[fixtures]]
name = "ps-credentialless"
argv = ["ps", "-a"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-docker/docker.ps@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "container listing is local-only"

[[fixtures]]
name = "inspect-credentialless"
argv = ["inspect", "my_container"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-docker/docker.inspect@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "container inspection is local-only"

