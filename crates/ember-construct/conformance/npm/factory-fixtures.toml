[[fixtures]]
name = "publish-explicit-registry-needs-resolver"
argv = ["publish", "--registry", "https://registry.npmjs.org/"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "package name/version, workspace, provenance, and registry authority must be resolved"

[[fixtures]]
name = "deprecate-needs-resolver"
argv = ["deprecate", "mypkg@1.0.0", "use mypkg@2"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "registry operation needs package identity resolution"

[[fixtures]]
name = "package-json-needs-payload-analysis"
argv = ["publish", "--package", "pkg.tgz"]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "package metadata and tarball contents determine published resource identity"

[[fixtures]]
name = "inline-auth-token-fails-closed"
argv = ["publish", "--//registry.npmjs.org/:_authToken=npm-token"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "inline auth token supplies native credential material"

[[fixtures]]
name = "unpublish-fails-closed"
argv = ["unpublish", "mypkg@1.0.0"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "destructive registry mutation is explicitly denied"
