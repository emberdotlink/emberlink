# CLASSIFICATION: PUBLIC
# P24 npm construct-factory fixtures.

[[fixtures]]
name = "version-flag-credentialless"
argv = ["--version"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-npm/npm.version@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "local CLI version inspection must not inherit npm credentials"

[[fixtures]]
name = "run-script-credentialless"
argv = ["run", "build"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-npm/npm.run-script@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true

