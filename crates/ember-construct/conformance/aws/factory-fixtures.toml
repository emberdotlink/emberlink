# CLASSIFICATION: PUBLIC
# P24 AWS construct-factory conformance corpus.
#
# This file records current supported exact-target PermissionSpec shapes and
# fail-closed dispositions. It is test evidence, not construct.toml carrier
# metadata and not native AWS policy supplied by a construct author.

[[fixtures]]
name = "s3-cp-local-to-exact-object"
argv = ["s3", "cp", "dist/app.tar.gz", "s3://assets/releases/app.tar.gz"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-aws/aws.s3.cp@v1"
expected_disposition = "mediated"
expected_target = { provider = "aws", service = "s3", bucket = "assets", key = "releases/app.tar.gz" }
expected_need = { provider_ir = "aws_permissionspec", actions = ["s3:PutObject"] }
expected_credential_injection = true

