[[fixtures]]
name = "version-credentialless"
argv = ["--version"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-okta/okta.version@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "local CLI version inspection must not inherit Okta credentials"

[[fixtures]]
name = "users-delete-needs-resolver"
