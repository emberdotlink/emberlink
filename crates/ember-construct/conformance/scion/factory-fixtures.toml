# CLASSIFICATION: PUBLIC
# P24 SCION construct-factory conformance corpus.
#
# Scion's classifier expects argv[0] = binary name (non-identity argv translator
# per ADR 140 §4), unlike other constructs where argv starts at the subcommand.

# --- Credentialless: read-only and local container lifecycle ---

[[fixtures]]
name = "list-credentialless"
argv = ["ember-scion", "list"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-scion/list@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "container listing must not receive provider credentials"

[[fixtures]]
name = "logs-credentialless"
argv = ["ember-scion", "logs", "worker-a"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-scion/logs@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "reading container logs is a local observability operation"

[[fixtures]]
name = "stop-credentialless"
argv = ["ember-scion", "stop", "worker-a"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-scion/stop@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "stopping a local container is a lifecycle operation that does not need provider credentials"

[[fixtures]]
name = "attach-credentialless"
argv = ["ember-scion", "attach", "worker-a"]
expected_action_ref = "registry.ember.systems/ember-systems/ember-scion/attach@v1"
expected_disposition = "credentialless"
expected_credential_injection = false
expected_ambient_credentials_stripped = true
reason = "attaching to a running container is a local operation"

# --- ResolverRequired: needs persona/exec-space/authority resolution ---

[[fixtures]]
name = "start-needs-resolver"
argv = ["ember-scion", "start", "worker-a", "--persona", "claude-code-default"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "runtime persona, lease, and execution-space target must be resolved by authority space"

[[fixtures]]
name = "delete-needs-resolver"
argv = ["ember-scion", "delete", "worker-a"]
expected_disposition = "resolver_required"
expected_credential_injection = false
reason = "destructive container deletion requires authority resolution"

# --- PayloadAnalysisRequired: authority-bearing payload ---

[[fixtures]]
name = "start-with-brief-needs-payload-analysis"
argv = ["ember-scion", "start", "worker-a", "--brief", "fix the deployment"]
expected_disposition = "payload_analysis_required"
expected_credential_injection = false
reason = "handoff/brief payload can carry scope, acceptance, and authority requirements"

# --- UnsupportedFailClosed: capability escapes ---

[[fixtures]]
name = "max-depth-flag-fails-closed"
argv = ["ember-scion", "start", "worker-a", "--max-depth", "3"]
expected_disposition = "unsupported_fail_closed"
expected_credential_injection = false
reason = "spawn-depth authority is moving to Statement.can_delegate and is not a CLI-native scope input"
