# CLASSIFICATION: PUBLIC
# Construct manifest for ember-docker per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-docker"
plugin_address = "registry.ember.systems/ember-systems/ember-docker"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Docker CLI Construct"
description = "Docker CLI Construct. Gates `docker` invocations through ember's action policy: push/login/logout/run/build/exec/cp and cleanup verbs are classified and gated; read-only verbs (ps, images, inspect, logs, stats) are passthrough. Current runtime still relies on caller-supplied registry auth via DOCKER_CONFIG / related env/file passthrough rather than broker-minted registry credentials. Privileged invocations (--privileged, --pid=host, --network=host, host-root volume mounts) are refused outright."

[defaults]
materialization_class = "declared_host_material"
material_classes = [{ kind = "file_env", name = "DOCKER_CONFIG" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "docker"

[[actions]]
key = "docker.push.dockerhub"
action_version = "v1"
summary = "Run docker.push.dockerhub"
input_schema = { kind = "argv", classifier = "push dockerhub *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:docker.push.dockerhub"
semantic_labels = ["docker.push.dockerhub"]

[[actions]]
key = "docker.push"
action_version = "v1"
summary = "Run docker.push"
input_schema = { kind = "argv", classifier = "push *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
