# CLASSIFICATION: PUBLIC
# Construct manifest for ember-tofu per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-tofu"
plugin_address = "registry.ember.systems/ember-systems/ember-tofu"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "OpenTofu CLI Construct"
description = "OpenTofu CLI Construct. Mediates `tofu` state mutations through ember's broker: `tofu destroy` (catastrophic — tears down everything), `tofu force-unlock` (manual lock override), `tofu state {rm, replace-provider, push}` (direct state mutation), and `tofu workspace delete` (workspace-scoped destruction) all require biometric approval. `tofu apply` gates without biometric — apply is the normal operational path and the destructive subset is constrained by what the underlying providers allow (gated by ember-aws / ember-az / ember-gcloud separately). `tofu taint` / `tofu untaint` / `tofu refresh` / `tofu import` / `tofu workspace {new, select}` / `tofu state mv` are gated. NO credential injection at this layer — cloud creds flow through the provider Constructs."

[defaults]
materialization_class = "none"
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "tofu"

[[actions]]
key = "tofu.apply"
action_version = "v1"
summary = "Run tofu.apply"
input_schema = { kind = "argv", classifier = "apply *" }
risk_tier = "medium"
idempotency = "conditionally_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:tofu.apply"
semantic_labels = ["tofu.apply"]

[[actions]]
key = "tofu.destroy"
action_version = "v1"
summary = "Run tofu.destroy"
input_schema = { kind = "argv", classifier = "destroy *" }
risk_tier = "high"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
biometric = "required"
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:tofu.destroy"
semantic_labels = ["tofu.destroy"]

