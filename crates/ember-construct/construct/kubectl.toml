# CLASSIFICATION: PUBLIC
# Construct manifest for ember-kubectl per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-kubectl"
plugin_address = "registry.ember.systems/ember-systems/ember-kubectl"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "kubectl CLI Construct"
description = "kubectl CLI Construct. Mediates `kubectl` invocations through ember's broker: apply/patch/edit/replace/create require biometric approval; delete is budget-capped at 3/session with biometric confirmation; exec/cp are biometric-gated (privileged pod access); rollout pause/resume/undo/restart, set image/env/resources, label, annotate, port-forward, proxy, cordon/drain/uncordon/taint, scale, run, and debug are gated. Read-only verbs (get, describe, logs, top, auth, cluster-info, version, api-resources, api-versions, explain, wait, events) and config context ops are passthrough — no broker mediation."

[defaults]
materialization_class = "declared_host_material"
material_classes = [{ kind = "file_env", name = "KUBECONFIG" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "kubectl"

[[actions]]
key = "kubectl.apply"
action_version = "v1"
summary = "Run kubectl.apply"
input_schema = { kind = "argv", classifier = "apply *" }
risk_tier = "high"
idempotency = "conditionally_idempotent"
interaction_class = "inline_interactive"
default = "permit"
biometric = "required"
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:kubectl.apply"
semantic_labels = ["kubectl.apply"]

[[actions]]
key = "kubectl.patch"
action_version = "v1"
summary = "Run kubectl.patch"
input_schema = { kind = "argv", classifier = "patch *" }
risk_tier = "high"
