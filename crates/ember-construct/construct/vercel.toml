# CLASSIFICATION: PUBLIC
# Construct manifest for ember-vercel per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-vercel"
plugin_address = "registry.ember.systems/ember-systems/ember-vercel"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Vercel CLI Construct"
description = "Vercel CLI Construct. Mediates `vercel` invocations through ember's credential broker: project/domain/team/secret/alias removals (irreversible loss) require biometric; `domains buy` (spending money) requires biometric; `tokens revoke` (privilege removal) requires biometric; `env remove` (can break prod) requires biometric. All other classified mutating verbs (deploy, env add/pull/push, projects add, domains add, dns/certs ops, alias set, integration add, rollback, promote, teams create/invite, tokens create, secrets add/rename, git disconnect) gate without biometric. VERCEL_TOKEN is the credential injection env var."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "vercel" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "vercel"

[[actions]]
key = "vercel.deploy"
action_version = "v1"
summary = "Run vercel.deploy"
input_schema = { kind = "argv", classifier = "deploy *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:vercel.deploy"
semantic_labels = ["vercel.deploy"]

