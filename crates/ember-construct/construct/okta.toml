# CLASSIFICATION: PUBLIC
# Construct manifest for ember-okta per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-okta"
plugin_address = "registry.ember.systems/ember-systems/ember-okta"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Okta CLI Construct"
description = "Okta admin CLI Construct. Mediates `okta` mutations through ember's broker: account-removal verbs (users delete/deactivate/suspend, users reset-password — account-takeover risk), group/app/policy/factor/idps destruction (groups delete, apps delete/deactivate, policies delete/deactivate, factors reset/deactivate, idps delete/deactivate), and session.end (force user logout) all require biometric approval. system-log.export gates without biometric (auditable read but not destructive). All other classified mutating verbs (creates, updates, assignments) gate without biometric. OKTA_API_TOKEN injects via env; daemon zeroizes on child exit."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "okta" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "okta"

[[actions]]
key = "okta.users.create"
action_version = "v1"
summary = "Run okta.users.create"
input_schema = { kind = "argv", classifier = "users create *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:okta.users.create"
semantic_labels = ["okta.users.create"]

[[actions]]
key = "okta.users.delete"
action_version = "v1"
summary = "Run okta.users.delete"
input_schema = { kind = "argv", classifier = "users delete *" }
