# CLASSIFICATION: PUBLIC
# Construct manifest for ember-gcloud per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-gcloud"
plugin_address = "registry.ember.systems/ember-systems/ember-gcloud"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Google Cloud CLI Construct"
description = "Google Cloud CLI Construct. Mediates `gcloud` invocations through ember's credential broker: IAM privilege removal (service-accounts.delete, roles.delete, policies.remove-iam-policy-binding), KMS key destruction (keys.destroy) and decrypt (keys.decrypt), storage data destruction (storage.rm), VM destruction (compute.instances.delete), function/service deletion (functions.delete, run.services.delete), cluster deletion (container.clusters.delete), and secrets reveal (secrets.versions.access) all require biometric approval. Project deletion (projects.delete) is denied by default and requires an explicit grant override. OAuth tokens inject via CLOUDSDK_AUTH_ACCESS_TOKEN; SA-key fallback path uses GOOGLE_APPLICATION_CREDENTIALS."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "gcp" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "gcloud"

[[actions]]
key = "gcloud.compute.instances.create"
action_version = "v1"
summary = "Run gcloud compute instances create"
input_schema = { kind = "argv", classifier = "compute instances create *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:gcloud.compute.instances.create"
semantic_labels = ["gcloud.compute.instances.create"]

