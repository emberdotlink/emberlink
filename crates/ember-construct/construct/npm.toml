# CLASSIFICATION: PUBLIC
# Construct manifest for ember-npm per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-npm"
plugin_address = "registry.ember.systems/ember-systems/ember-npm"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "npm CLI Construct"
description = "npm CLI Construct. Gates `npm` invocations through ember's action policy: publish/version/deprecate/dist-tag/install/ci/run-script/audit-fix are classified and gated; read-only verbs (ls, view, info, outdated, audit, config get, search, ping, whoami) are passthrough. Current runtime still relies on caller-supplied registry auth via `NPM_TOKEN` / `.npmrc` passthrough rather than broker-minted registry credentials. Mutating publish-class actions (publish, version, deprecate, dist-tag) require biometric approval and are budget-capped per session."

[defaults]
materialization_class = "declared_host_material"
material_classes = [{ kind = "env", name = "NPM_TOKEN" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "npm"

[[actions]]
key = "npm.publish"
action_version = "v1"
summary = "Run npm.publish"
input_schema = { kind = "argv", classifier = "publish *" }
risk_tier = "high"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
biometric = "required"
budget_caps = { max_per_session = 5 }
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:npm.publish"
semantic_labels = ["npm.publish"]

[[actions]]
key = "npm.publish.npmjs.org"
action_version = "v1"
summary = "Run npm.publish.npmjs.org"
input_schema = { kind = "argv", classifier = "publish npmjs org *" }
risk_tier = "high"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
biometric = "required"
budget_caps = { max_per_session = 5 }
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:npm.publish.npmjs.org"
