# CLASSIFICATION: PUBLIC
# Construct manifest for ember-az per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-az"
plugin_address = "registry.ember.systems/ember-systems/ember-az"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Azure CLI Construct"
description = "Azure CLI Construct. Mediates `az` invocations through ember's credential broker: privilege removal (role.assignment.delete, role.definition.delete), Key Vault destruction (keyvault.delete, keyvault.key.delete, keyvault.secret.delete) and reveal (keyvault.key.decrypt, keyvault.secret.show), VM destruction (vm.delete, vm.deallocate), AKS/SQL deletion (aks.delete, sql.server.delete, sql.db.delete), storage data destruction (storage.account.delete, storage.blob.delete, storage.container.delete), and webapp/functionapp deletion (functionapp.delete, webapp.delete) all require biometric approval. Resource group deletion (group.delete) is denied by default and requires an explicit grant override. OAuth tokens inject via AZURE_ACCESS_TOKEN; SP-file fallback path uses AZURE_AUTH_LOCATION."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "azure_cli" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "az"

[[actions]]
key = "az.vm.create"
action_version = "v1"
summary = "Run az vm create"
input_schema = { kind = "argv", classifier = "vm create *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:az.vm.create"
semantic_labels = ["az.vm.create"]

