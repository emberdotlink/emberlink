# CLASSIFICATION: PUBLIC
# Construct manifest for ember-az per design §2.
#
# Action schema: each [[actions]] declares an allowed action_key, optional
# budget caps, biometric requirement, and a permit/deny default. The daemon's
# broker.resolve consults this to decide whether the action requires a
# credential mint, an existing grant, or refuses.
#
# Credential injection: the broker (`BrokerProvider::AzureCli`) issues
# short-lived OAuth bearer tokens via service-principal client-credentials
# grant scoped to the grant's allowed actions. The daemon materializes them
# into AZURE_ACCESS_TOKEN (azure-cli honors this for non-interactive auth)
# or — for the SP-file fallback path — writes a temp service-principal
# credential file at ~/.ember/shadow/az-sp-<materialization-id>.json and
# exports AZURE_AUTH_LOCATION. Daemon zeroizes + unlinks on child exit.
#
# Read-only verbs (`show`, `list`, `get-*`, `account list`, `account show`)
# classify to `None` (passthrough) and never reach this manifest.

[meta]
name = "ember-az"
version = "0.1.0"
publisher = "did:emberlink"
description = "Azure CLI Construct. Mediates `az` invocations through ember's credential broker: privilege removal (role.assignment.delete, role.definition.delete), Key Vault destruction (keyvault.delete, keyvault.key.delete, keyvault.secret.delete) and reveal (keyvault.key.decrypt, keyvault.secret.show), VM destruction (vm.delete, vm.deallocate), AKS/SQL deletion (aks.delete, sql.server.delete, sql.db.delete), storage data destruction (storage.account.delete, storage.blob.delete, storage.container.delete), and webapp/functionapp deletion (functionapp.delete, webapp.delete) all require biometric approval. Resource group deletion (group.delete) is denied by default and requires an explicit grant override. OAuth tokens inject via AZURE_ACCESS_TOKEN; SP-file fallback path uses AZURE_AUTH_LOCATION."

# Default policy for unlisted action keys.
default = "deny"

# --- vm ---

[[actions]]
key = "az.vm.create"
default = "permit"
mode = "gate"

[[actions]]
key = "az.vm.start"
default = "permit"
mode = "gate"

[[actions]]
key = "az.vm.stop"
default = "permit"
mode = "gate"

[[actions]]
key = "az.vm.restart"
default = "permit"
mode = "gate"

# vm delete: irreversible; biometric required.
[[actions]]
key = "az.vm.delete"
default = "permit"
mode = "gate"
biometric = "required"

# vm deallocate: irreversible (releases compute resources); biometric required.
[[actions]]
key = "az.vm.deallocate"
default = "permit"
mode = "gate"
biometric = "required"

# --- vmss (Virtual Machine Scale Sets) ---

