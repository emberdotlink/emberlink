# CLASSIFICATION: PUBLIC
# construct_silence_override_catalog_v030_landed
# Construct manifest for ember-git per design §2.
# Action schema: each [[actions]] declares an allowed action_key, optional
# budget caps, biometric requirement, and a permit/deny default. The daemon's
# broker.resolve consults this to decide whether the action requires a
# credential mint, an existing grant, or refuses.
#
# Cohort-A scope catalog per design §"Cohort-A scopes":
#   Gated — broker round-trip required (destructive or credential-carrying).
#   Passthrough — None (read-only / safe write).
#
# git_toml_passthrough_description_reconciled: the [meta].description used to
# describe pull / fetch as passthrough, which contradicted `policy.rs` —
# fetch / clone / pull mint a GitHub App installation token (contents:read)
# for private-repo auth via URL rewrite. The description now reflects the
# policy.rs reality: they're broker-mediated (auth-only), not passthrough.

[meta]
name = "ember-git"
version = "0.1.0"
publisher = "did:emberlink"
description = "Git CLI Construct. Mediates destructive and credential-carrying `git` invocations through ember's broker: push mints a scoped installation token (contents:write); fetch/clone/pull mint a scoped installation token (contents:read) via URL rewrite for private-repo auth; force-push, reset --hard, clean -f, commit --amend, rebase -i, branch -D, and tag -d are gated (some budget-capped at 3/session with biometric confirmation). Read-only local verbs (status, log, diff, show, etc.) and safe local writes (commit, add, checkout, etc.) are passthrough — no broker mediation."
authority_refs = ["github"]

# Default policy for unlisted action keys.
default = "deny"

# --- push surface ---

[[actions]]
key = "git.push"
default = "permit"

[[actions]]
key = "git.push.force"
default = "prompt"         # rewrites remote history; biometric required

[[actions]]
key = "git.push.tags"
default = "permit"

# --- local history rewrite ---

[[actions]]
key = "git.commit.amend"
default = "prompt"         # rewrites local history

[[actions]]
key = "git.rebase.interactive"
default = "prompt"         # interactive rebase rewrites history

# --- destructive local ops (budget-capped) ---

[[actions]]
key = "git.reset.hard"
default = "prompt"         # biometric required; discards uncommitted work
budget_caps = { wall_clock_secs = 86400, max_uses = 3 }

[[actions]]
key = "git.clean.force"
default = "prompt"         # biometric required; deletes untracked files
budget_caps = { wall_clock_secs = 86400, max_uses = 3 }

# --- stash discard (destructive — discards stashed work permanently) ---

[[actions]]
key = "git.stash.drop"
default = "prompt"         # biometric required; discards stashed work

# --- ref management ---

[[actions]]
key = "git.branch.force_delete"
default = "prompt"         # biometric required; destroys local branch

[[actions]]
key = "git.tag.delete"
default = "prompt"         # gated; deleting a tag is non-trivial to undo

# --- repository maintenance ---

[[actions]]
key = "git.gc.destructive"
default = "prompt"         # --aggressive or --prune=now; data loss risk

# --- passthrough / safe writes ---

[[actions]]
key = "git.submodule.update"
default = "permit"

# --- silence-override catalog (design §C8 Knob 10) ---

[actions.git-fetch]
classify_argv = "fetch *"
silence_timeout_secs = 300    # large fetches go quiet during pack-resolution
