# Read-side remote operations. Passthrough at classify time (no runtime gate);
# declared so template lowering resolves their contents:read need (ADR 204
# Amendment 6). A private-repo fetch/clone/pull authenticates via the broker's
# per-host URL rewrite when a token is in play.
[[actions]]
key = "git.fetch"
action_version = "v1"
summary = "Run git.fetch"
input_schema = { kind = "argv", classifier = "fetch *" }
risk_tier = "low"
idempotency = "idempotent"
interaction_class = "inline_interactive"
default = "permit"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:git.fetch"
semantic_labels = ["git.fetch"]
need = ["github:metadata:read", "github:contents:read"]

