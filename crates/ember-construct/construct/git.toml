# CLASSIFICATION: PUBLIC
# Construct manifest for ember-git per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.
#
# `need` (ADR 204 Amendment 6): the action's least-privilege authority need in
# the canonical `provider:object:verb` algebra; the daemon resolves it here and
# the projector derives native scope (I6). GitHub App installation tokens always
# carry metadata:read, so every credential-minting git action declares that
# provider-mandatory baseline. `git.push` mutates remote refs (contents:write);
# `git.{fetch,clone,pull}` read the remote (contents:read).
# The fetch/clone/pull actions are passthrough at classify time (no runtime
# gate) but are declared here so a read-only delegation template that scopes
# them lowers to a contents:read standing grant — never silently to a write.

schema_version = "2"
default = "deny"

[meta]
name = "ember-git"
plugin_address = "registry.ember.systems/ember-systems/ember-git"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Git CLI Construct"
description = "Git CLI Construct. Mediates destructive and credential-carrying `git` invocations through ember's broker: push mints a scoped installation token (contents:write); fetch/clone/pull mint a scoped installation token (contents:read) via URL rewrite for private-repo auth; force-push, reset --hard, clean -f, commit --amend, rebase -i, branch -D, and tag -d are gated (some budget-capped at 3/session with biometric confirmation). Read-only local verbs (status, log, diff, show, etc.) and safe local writes (commit, add, checkout, etc.) are passthrough — no broker mediation."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "github" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "git"

[[actions]]
key = "git.push"
action_version = "v1"
summary = "Run git.push"
input_schema = { kind = "argv", classifier = "push *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:git.push"
semantic_labels = ["git.push"]
need = ["github:metadata:read", "github:contents:write"]

[[actions]]
key = "git.push.force"
action_version = "v1"
summary = "Run git.push.force"
input_schema = { kind = "argv", classifier = "push force *" }
risk_tier = "high"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "prompt"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:git.push.force"
semantic_labels = ["git.push.force"]

