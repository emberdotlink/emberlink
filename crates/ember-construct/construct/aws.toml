# CLASSIFICATION: PUBLIC
# Construct manifest for ember-aws per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-aws"
plugin_address = "registry.ember.systems/ember-systems/ember-aws"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "AWS CLI Construct"
description = "AWS CLI v2 Construct. Mediates `aws` invocations through ember's credential broker: IAM privilege removal (delete-*, detach-*) and KMS key/secret destruction (schedule-key-deletion, decrypt) require biometric approval; S3 destructive ops (rm, delete-object) gate by default and require biometric when targeting a grant's production_buckets; secretsmanager.delete-secret and ec2.terminate-instances require biometric. STS credentials inject via AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN; AWS_DEFAULT_REGION may pass through as non-authority context."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "aws_sts" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "aws"

[[actions]]
key = "aws.s3.cp"
action_version = "v1"
summary = "Run aws s3 cp"
input_schema = { kind = "argv", classifier = "s3 cp *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:aws.s3.cp"
semantic_labels = ["aws.s3.cp"]

