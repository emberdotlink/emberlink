# CLASSIFICATION: PUBLIC
# Construct manifest for ember-wrangler per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-wrangler"
plugin_address = "registry.ember.systems/ember-systems/ember-wrangler"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Wrangler CLI Construct"
description = "Wrangler CLI Construct. Gates `wrangler` invocations through ember's action policy: deploy and all mutation operations require biometric approval; delete (Worker script removal) and r2 object delete are budget-capped; d1 execute (raw SQL) requires biometric; kv:key put/delete and secret put/delete are biometric-gated. Current runtime still relies on caller-supplied `CLOUDFLARE_API_TOKEN` passthrough rather than daemon-minted scoped Cloudflare credentials. Read-only verbs (dev, tail, whoami, version, login, logout, kv:key list/get, r2 object list/get, d1 list/info, secret list) are passthrough — no broker mediation."

[defaults]
materialization_class = "declared_host_material"
material_classes = [{ kind = "env", name = "CLOUDFLARE_API_TOKEN" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "wrangler"

[[actions]]
key = "wrangler.deploy"
action_version = "v1"
summary = "Run wrangler.deploy"
input_schema = { kind = "argv", classifier = "deploy *" }
risk_tier = "high"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
biometric = "required"
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:wrangler.deploy"
semantic_labels = ["wrangler.deploy"]

[[actions]]
key = "wrangler.delete"
action_version = "v1"
summary = "Run wrangler.delete"
input_schema = { kind = "argv", classifier = "delete *" }
risk_tier = "high"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
biometric = "required"
budget_caps = { max_per_session = 1 }
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:wrangler.delete"
semantic_labels = ["wrangler.delete"]

