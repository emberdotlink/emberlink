# Construct manifest for ember-wrangler per design §2.
# Action schema: each [[actions]] declares an allowed action_key, optional
# budget caps, biometric requirement, and a permit/deny default. The daemon's
# broker.resolve consults this to decide whether the action requires a
# credential mint, an existing grant, or refuses.
#
# Current runtime relies on caller-supplied CLOUDFLARE_API_TOKEN via
# env_passthrough. A daemon-owned scoped Cloudflare token materialization lane
# is still follow-up work; this Construct is action-gated today but not a
# broker-shaped unattended authority seam.

[meta]
name = "ember-wrangler"
version = "0.1.0"
publisher = "did:emberlink"
description = "Wrangler CLI Construct. Gates `wrangler` invocations through ember's action policy: deploy and all mutation operations require biometric approval; delete (Worker script removal) and r2 object delete are budget-capped; d1 execute (raw SQL) requires biometric; kv:key put/delete and secret put/delete are biometric-gated. Current runtime still relies on caller-supplied `CLOUDFLARE_API_TOKEN` passthrough rather than daemon-minted scoped Cloudflare credentials. Read-only verbs (dev, tail, whoami, version, login, logout, kv:key list/get, r2 object list/get, d1 list/info, secret list) are passthrough — no broker mediation."
headless_requirements = ["env_passthrough_authority"]

# Default policy for unlisted action keys.
default = "deny"

# --- Workers script publish (biometric required) ---

[[actions]]
key = "wrangler.deploy"
default = "permit"
biometric = "required"

# --- Workers script removal (biometric required, budget cap 1/session) ---

[[actions]]
key = "wrangler.delete"
default = "permit"
biometric = "required"
budget_caps = { max_per_session = 1 }

# --- Secret mutations (biometric required) ---

[[actions]]
key = "wrangler.secret.put"
default = "permit"
biometric = "required"

[[actions]]
key = "wrangler.secret.delete"
default = "permit"
biometric = "required"

[[actions]]
key = "wrangler.secret.bulk"
default = "permit"
biometric = "required"

# --- R2 object mutations ---

[[actions]]
key = "wrangler.r2.put"
default = "permit"
biometric = "required"

[[actions]]
key = "wrangler.r2.delete"
default = "permit"
biometric = "required"
budget_caps = { max_per_session = 5 }

# --- R2 bucket mutations (biometric required) ---

[[actions]]
key = "wrangler.r2.bucket.create"
default = "permit"
biometric = "required"

# --- KV key mutations (biometric required) ---

[[actions]]
key = "wrangler.kv.put"
default = "permit"
biometric = "required"

[[actions]]
key = "wrangler.kv.delete"
default = "permit"
biometric = "required"

# --- D1 SQL execution (biometric required) ---

[[actions]]
key = "wrangler.d1.execute"
default = "permit"
biometric = "required"

# --- D1 database provisioning (biometric required) ---

[[actions]]
key = "wrangler.d1.create"
default = "permit"
biometric = "required"

# --- Pages deploy (biometric required) ---

[[actions]]
key = "wrangler.pages.deploy"
default = "permit"
biometric = "required"

# --- Gap-fill from construct-coverage-audit (implementation-note-94) ---
# wrangler.secret.bulk: bulk-import secrets from JSON; same threat model as secret.put
# wrangler.r2.bucket.create: persistent R2 bucket creation
# wrangler.d1.create: persistent D1 database creation
# (per construct-coverage-audit)

[[actions]]
key = "wrangler.secret.bulk"
default = "permit"
biometric = "required"

[[actions]]
key = "wrangler.r2.bucket.create"
default = "permit"
biometric = "required"

[[actions]]
key = "wrangler.d1.create"
default = "permit"
biometric = "required"
