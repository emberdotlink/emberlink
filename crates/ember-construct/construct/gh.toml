# CLASSIFICATION: PUBLIC
# Construct manifest for ember-gh per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.
#
# `need` (ADR 204 Amendment 6, checkpoint action_need_is_manifest_sourced_not_hardcoded):
# the action's least-privilege authority need in the canonical
# `provider:object:verb` algebra. The daemon resolves it from this bundled
# manifest (include_str!-compiled — same trust base as the former hardcoded
# `policy::github_action_need`) and the projector derives native scope (I6).
# Absent ⇒ no provider credential is minted. GitHub App installation tokens
# always carry metadata:read, so every brokered GitHub action declares that
# provider-mandatory baseline alongside its verb-specific need. Per-verb-
# correct: pr_close needs only the PR-object write (not contents:write);
# workflow_run needs actions:write to dispatch (not actions:read).

schema_version = "2"
default = "deny"

[meta]
name = "ember-gh"
plugin_address = "registry.ember.systems/ember-systems/ember-gh"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "GitHub CLI Construct"
description = "GitHub CLI (`gh`) Construct. Mediates `gh` invocations through ember's credential broker: each call mints a scoped, time-bound GitHub App installation token with permissions narrowed to the requested action (pr_create, pr_merge, pr_list, workflow_run, etc.), injects it at exec time, revokes the token on exit, and emits a signed Receipt of the invocation. The agent never holds a long-lived GitHub PAT; every credentialed call is grant-gated, audited, and revocable."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "github" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "gh"

[[actions]]
key = "pr_create"
action_version = "v1"
summary = "Run pr create"
input_schema = { kind = "argv", classifier = "pr create *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:gh.pr_create"
semantic_labels = ["github.pull_request.write", "scm.pull_request.write"]
need = ["github:metadata:read", "github:contents:write", "github:pull_request:create"]

[[actions]]
key = "pr_merge"
action_version = "v1"
summary = "Run pr merge"
input_schema = { kind = "argv", classifier = "pr merge *" }
risk_tier = "high"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "prompt"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:gh.pr_merge"
semantic_labels = ["github.pr_merge"]
need = ["github:metadata:read", "github:contents:write", "github:pull_request:create"]

