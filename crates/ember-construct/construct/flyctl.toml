# CLASSIFICATION: PUBLIC
# Construct manifest for ember-flyctl per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-flyctl"
plugin_address = "registry.ember.systems/ember-systems/ember-flyctl"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Fly.io CLI Construct"
description = "Fly.io CLI Construct. Mediates `flyctl`/`fly` invocations through ember's credential broker: irreversible destruction (apps/machine/volumes/postgres/redis destroy) requires biometric; secrets unset (silent secret loss) requires biometric; tokens/orgs revoke (privilege removal) requires biometric; machine exec and ssh console (arbitrary code execution / interactive shell) require biometric. All other classified mutating verbs gate without biometric. FLY_API_TOKEN is the credential injection env var."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "fly_io" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "flyctl"

[[actions]]
key = "fly.apps.create"
action_version = "v1"
summary = "Run fly.apps.create"
input_schema = { kind = "argv", classifier = "apps create *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:fly.apps.create"
semantic_labels = ["fly.apps.create"]

