# CLASSIFICATION: PUBLIC
# Construct manifest for ember-terraform per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-terraform"
plugin_address = "registry.ember.systems/ember-systems/ember-terraform"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "Terraform CLI Construct"
description = "HashiCorp Terraform CLI Construct (sister to ember-tofu). Mediates `terraform` state mutations through ember's broker: `terraform destroy` (catastrophic — tears down everything), `terraform force-unlock` (manual lock override), `terraform state {rm, replace-provider, push}` (direct state mutation), and `terraform workspace delete` (workspace-scoped destruction) all require biometric approval. `terraform apply` gates without biometric — apply is the normal operational path and the destructive subset is constrained by what the underlying providers allow (gated by ember-aws / ember-az / ember-gcloud separately). `terraform taint` / `terraform untaint` / `terraform refresh` / `terraform import` / `terraform workspace {new, select}` / `terraform state mv` are gated. NO credential injection at this layer — cloud creds flow through the provider Constructs."

[defaults]
materialization_class = "none"
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "terraform"

[[actions]]
key = "terraform.apply"
action_version = "v1"
summary = "Run terraform.apply"
input_schema = { kind = "argv", classifier = "apply *" }
risk_tier = "medium"
idempotency = "conditionally_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:terraform.apply"
semantic_labels = ["terraform.apply"]

[[actions]]
key = "terraform.destroy"
action_version = "v1"
summary = "Run terraform.destroy"
input_schema = { kind = "argv", classifier = "destroy *" }
risk_tier = "high"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
biometric = "required"
audit_fields = ["action_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:terraform.destroy"
semantic_labels = ["terraform.destroy"]

