[package]
name = "emberlink-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for Emberlink agent authorization"
publish = false

[dependencies]
core-mcp = { path = "../core-mcp" }
core-state = { path = "../core-state" }
core-types = { path = "../core-types" }
emberlink-agent = { path = "../emberlink-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "macros"] }

[dev-dependencies]
ember-daemon = { path = "../ember-daemon" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
