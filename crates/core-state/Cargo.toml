[package]
name = "core-state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-crypto = { path = "../core-crypto" }
core-eventlog = { path = "../core-eventlog" }
core-events = { path = "../core-events" }
core-storage = { path = "../core-storage" }
core-types = { path = "../core-types" }
core-principals = { path = "../core-principals" }
core-event-types = { path = "../core-event-types" }
core-grant-types = { path = "../core-grant-types" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
csv = "1"
ed25519-dalek = "2.1.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
subtle = "2.6"
urlencoding = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
