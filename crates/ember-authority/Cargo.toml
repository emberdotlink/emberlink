[package]
name = "ember-authority"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Action authority, settlement journal, and Receipt verification."
publish = false
autobins = false

[dependencies]
base64 = "=0.22.1"
core-crypto = { path = "../core-crypto" }
core-events = { path = "../core-events" }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
hex = "=0.4.3"
libc = "=0.2.186"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
time = { version = "=0.3.47", features = ["formatting", "parsing", "serde"] }
uuid = { version = "=1.23.2", features = ["serde", "v4"] }
zeroize = "=1.8.2"

[dev-dependencies]
tempfile = "=3.27.0"
