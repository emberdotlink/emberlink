[package]
name = "ember-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wasm runtime scaffold for capability-scoped tool execution. Agents run Wasm modules; never see raw credentials."
repository = "https://github.com/emberdotlink/emberlink"
publish = false

[lib]
name = "ember_tools"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
