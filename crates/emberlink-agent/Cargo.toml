[package]
name = "emberlink-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JSON-over-stdio agent protocol for Emberlink grant access"

[dependencies]
core-types = { path = "../core-types" }
core-state = { path = "../core-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "macros"] }

[[bin]]
name = "emberlink-agent"
path = "src/main.rs"
