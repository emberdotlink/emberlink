[package]
name = "emberlink-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JSON-over-stdio agent protocol for Emberlink grant access"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
core-crypto = { path = "../core-crypto" }
core-types = { path = "../core-types" }
core-state = { path = "../core-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "macros", "net", "sync"] }
tracing = "0.1"
tungstenite = "0.29"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "emberlink-agent"
path = "src/main.rs"

[lints]
workspace = true
