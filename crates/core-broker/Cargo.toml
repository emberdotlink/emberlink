[package]
name = "core-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Broker trait, request/response types, and MockBroker for the Emberlink credential broker (design)."
publish = false

[dependencies]
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Native-only — ureq pulls in std-net + native TLS and does not compile to
# `wasm32-unknown-unknown`. The `anthropic` module is `#[cfg(not(target_arch
# = "wasm32"))]` so the wasm32 build of `core-broker` skips it entirely.
# `chrono` carries the `expires_at: Option<DateTime<Utc>>` shape declared in
# `AnthropicScope` (per design §7); it is wasm32-eligible.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde", "std"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
