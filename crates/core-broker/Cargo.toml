[package]
name = "core-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Broker trait, request/response types, and MockBroker for the Emberlink credential broker (ADR 094)."
publish = false

[dependencies]
core-event-types = { path = "../core-event-types" }
core-grant-types = { path = "../core-grant-types" }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Provider-impl deps. Optional + native-only (wasm32 builds skip them; --no-default-features omits them entirely).
# `chrono` carries the `expires_at: Option<DateTime<Utc>>` shape declared in `AnthropicScope` (ADR 096 §7).
# `ureq` is the native HTTP client used by both Anthropic and Cloudflare brokers; it does not compile to wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde", "std"], optional = true }
ureq = { version = "3", default-features = false, features = ["json", "rustls"], optional = true }

[features]
default = []
anthropic = ["dep:chrono", "dep:ureq"]
cloudflare = ["dep:chrono", "dep:ureq"]

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
