[package]
name = "core-kms"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vault Transit-compatible KMS surface for the Emberlink daemon (ADR 100)"
publish = false

# This crate hosts an HTTP listener and is NOT wasm-eligible.
# axum + tokio are app-tier deps; do not add this crate to the wasm CI gate.

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
core-types = { path = "../core-types" }
core-grant-types = { path = "../core-grant-types" }
getrandom = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = "0.5"
secrecy = { version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
