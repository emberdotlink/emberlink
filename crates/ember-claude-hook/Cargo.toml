[package]
name = "ember-claude-hook"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ember-claude-hook — Claude Code PreToolUse hook for the Ember trust layer (design)."
repository = "https://github.com/emberdotlink/emberlink"
publish = false

[[bin]]
name = "ember-claude-hook"
path = "src/main.rs"

[dependencies]
anyhow = "1"
core-config = { path = "../core-config" }
core-grant-types = { path = "../core-grant-types" }
core-policy = { path = "../core-policy" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
