[package]
name = "core-principals"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Identity primitives: persona, identity, recovery, trust,
# credential_delivery, network + key/trust type tags. Holds *type
# definitions*; Layer-3 `core-identity` / `core-personas` / `core-trust`
# hold *operations on them*. Per ADR 156.

[dependencies]
core-types = { path = "../core-types" }
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ciborium = { version = "0.2", default-features = false }

[dev-dependencies]
proptest = "1"
sha2.workspace = true

[lints]
workspace = true
