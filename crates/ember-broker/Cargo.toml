[package]
name = "ember-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Approval delivery channels + grant-request routing for ember-broker."
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-credential-types = "1.2"
aws-sigv4 = { version = "1.4", default-features = false, features = ["sign-http", "http1"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
core-broker = { path = "../core-broker" }
ed25519-dalek = "2.1.1"
getrandom = "0.3"
http = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
