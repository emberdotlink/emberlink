# CLASSIFICATION: PUBLIC
# Construct manifest for ember-vault per ADR 196.
# Legacy broker policy fields (`default`, `mode`, biometric flags,
# and `budget_caps`) are retained during the v0.3.0 carrier
# migration because the live daemon still consumes them.

schema_version = "2"
default = "deny"

[meta]
name = "ember-vault"
plugin_address = "registry.ember.systems/ember-systems/ember-vault"
plugin_version = "0.1.0"
publisher = "did:emberlink"
provider_kind = "cli"
summary = "HashiCorp Vault CLI Construct"
description = "HashiCorp Vault CLI Construct. Mediates `vault` invocations through ember's credential broker: secret reveals (read, kv get) gate for audit; policy mutations (policy.write/delete), auth-backend removal (auth.disable), secrets-backend removal (secrets.disable), token mass-revoke, lease.revoke-prefix, and irreversible kv.destroy require biometric; audit.disable defaults to deny. Scoped Vault child tokens inject via VAULT_TOKEN / VAULT_ADDR."

[defaults]
materialization_class = "brokered_credential"
material_classes = [{ kind = "broker", authority_ref = "hashi_vault" }]
default_runner_classes = ["local_trusted"]
headless_requirements = []

[runtime.cli]
wrapped_binary = "vault"

[[actions]]
key = "vault.write"
action_version = "v1"
summary = "Run vault.write"
input_schema = { kind = "argv", classifier = "write *" }
risk_tier = "medium"
idempotency = "non_idempotent"
interaction_class = "inline_interactive"
default = "permit"
mode = "gate"
audit_fields = ["action_ref", "authority_ref", "runner_class", "materialization_class", "terminal_outcome"]
handler_ref = "cli:vault.write"
semantic_labels = ["vault.write"]

[[actions]]
key = "vault.delete"
action_version = "v1"
