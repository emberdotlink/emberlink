<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Agent, authority, and execution spaces</title>
  <desc id="desc">Agent space sends structured action requests. Authority space evaluates grants and keeps standing credentials. Execution space receives only narrowed authority for the selected action.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#15803d"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .label { font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .body { font: 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
      .small { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .column { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 22; }
      .agent { fill: #eff6ff; stroke: #2563eb; }
      .authority { fill: #fff7ed; stroke: #ea580c; }
      .execution { fill: #f0fdf4; stroke: #16a34a; }
      .stop { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 16; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-green { stroke: #15803d; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .barrier { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="60" y="58">Three spaces, one authority boundary</text>
  <text class="subtitle" x="60" y="90">The agent can ask. The daemon decides. Execution receives only the authority needed for the approved action.</text>

  <rect class="column agent" x="55" y="145" width="310" height="365"/>
  <text class="label" x="95" y="190">Agent space</text>
  <text class="body" x="95" y="225">Prompts, transcripts, argv,</text>
  <text class="body" x="95" y="249">tool calls, and results.</text>
  <rect class="pill" x="95" y="285" width="220" height="38"/>
  <text class="small" x="122" y="309">Claude, Codex, MCP, SDK</text>
  <rect class="stop" x="95" y="365" width="220" height="72"/>
  <text class="body" x="122" y="395">Should not hold</text>
  <text class="body" x="122" y="419">standing credentials</text>

  <rect class="column authority" x="445" y="145" width="310" height="365"/>
  <text class="label" x="485" y="190">Authority space</text>
  <text class="body" x="485" y="225">emberd owns grants, policy,</text>
  <text class="body" x="485" y="249">custody, receipts, and audit.</text>
  <rect class="pill" x="485" y="285" width="220" height="38"/>
  <text class="small" x="535" y="309">standing credential</text>
  <rect class="pill" x="485" y="342" width="220" height="38"/>
  <text class="small" x="548" y="366">grant check</text>
  <rect class="pill" x="485" y="399" width="220" height="38"/>
  <text class="small" x="528" y="423">receipt signing</text>

  <rect class="column execution" x="835" y="145" width="310" height="365"/>
  <text class="label" x="875" y="190">Execution space</text>
  <text class="body" x="875" y="225">The selected runner invokes</text>
  <text class="body" x="875" y="249">the real target tool or API.</text>
  <rect class="pill" x="875" y="285" width="220" height="38"/>
  <text class="small" x="920" y="309">narrowed authority</text>
  <rect class="pill" x="875" y="342" width="220" height="38"/>
  <text class="small" x="925" y="366">bounded lifetime</text>
  <rect class="pill" x="875" y="399" width="220" height="38"/>
  <text class="small" x="926" y="423">target action</text>

  <path class="line" d="M365 275 H445"/>
  <text class="small" x="375" y="258">structured request</text>
  <path class="line-green" d="M755 323 H835"/>
  <text class="small" x="763" y="306">materialized authority</text>
  <path class="line" d="M835 455 C690 560 505 560 365 455"/>
  <text class="small" x="520" y="568">result plus receipt/audit evidence</text>

  <line class="barrier" x1="405" y1="125" x2="405" y2="535"/>
  <text class="small" x="392" y="555">standing credentials do not cross into agent space</text>
</svg>
