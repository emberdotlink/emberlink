[workspace]
members = [
    # implementation-note-1 — vestigial crate removed; name reused by emberlink-cli rename per implementation-note-2
    "crates/emberlink-agent",
    "crates/emberlink-mcp",
    "crates/emberlink-app",
    "crates/emberlink-cli",
    "crates/emberlink-relay",
    "crates/core-broker",
    "crates/core-construct-runtime",
    "crates/ember-construct-classify",
    "crates/core-types",
    "crates/core-crypto",
    "crates/core-events",
    "crates/core-eventlog",
    "crates/core-kms",
    "crates/core-state",
    "crates/core-identity",
    "crates/core-personas",
    "crates/core-trust",
    "crates/core-recovery",
    "crates/core-sync",
    "crates/core-storage",
    "crates/core-mcp",
    "crates/core-metrics",
    "crates/core-policy",
    "crates/core-approval",
    "crates/core-grants",
    "crates/core-grants-toml",
    "crates/core-config",
    "crates/ember-broker",
    "crates/ember-daemon",
    "crates/ember-gh",
    "crates/ember-tools",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.2.28"

[workspace.dependencies]
blake3 = "1"
sha2 = "0.11"
toml = "0.9"
