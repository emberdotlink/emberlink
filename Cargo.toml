[workspace]
members = [
    "rust/crates/core-types",
    "rust/crates/core-crypto",
    "rust/crates/core-events",
    "rust/crates/core-state",
    "rust/crates/core-identity",
    "rust/crates/core-personas",
    "rust/crates/core-policy",
    "rust/crates/core-trust",
    "rust/crates/core-recovery",
    "rust/crates/core-sync",
    "rust/crates/core-storage",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

