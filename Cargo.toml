    "crates/emberlink-mcp",
    "crates/emberlink-app",
    "crates/emberlink-cli",
    "crates/emberlink-relay",
    "crates/core-broker",
    "crates/core-construct-runtime",
    "crates/ember-construct",
    "crates/core-types",
    "crates/core-principals",
    "crates/core-event-types",
    "crates/core-grant-types",
    "crates/core-crypto",
    "crates/core-events",
    "crates/core-eventlog",
    "crates/core-fd-pass",
    "crates/core-kms",
    "crates/core-state",
    "crates/core-identity",
    "crates/core-personas",
    "crates/core-trust",
    "crates/core-recovery",
    "crates/core-sync",
    "crates/core-storage",
    "crates/core-mcp",
    "crates/core-metrics",
    "crates/core-policy",
    "crates/core-proxy-forward",
    "crates/core-receipts",
    "crates/core-approval",
    "crates/core-grants",
    "crates/core-grants-toml",
