resolver = "2"

# implementation-note-5 (Cluster D D1, design review 20260513-122447):
# Workspace-level convention for the `qa-mock` feature flag. Real
# feature declarations live per-crate (e.g. `crates/ember-daemon/Cargo.toml`
# carries `qa-mock = []` in its `[features]` section). The per-crate
# `build.rs` is the structural gate that refuses to build a release
# artifact (`EMBER_RELEASE=1`) with `qa-mock` enabled — test substrate
# must never ship in release binaries. Cluster D D2 trait refactor
# rides on top of this substrate.

# v0.3.0 audit Cluster D D1: release builds strip debug assertions
# explicitly so `cfg!(debug_assertions)`-gated paths are guaranteed
# off in shipping artifacts.
[profile.release]
debug-assertions = false

# host_linker_oom_remediation_landed —
# ember_daemon_test_link_oom_resolved (implementation-note-6).
# Strip debug info from test binaries. The ember-daemon test crate links
# ~300 rlibs; full debuginfo pushes peak linker working set to 6-8 GB on
# aarch64-linux, OOM-killing `ld` on the 15 GB headless VM. `panic!`
# still shows file:line via `RUST_BACKTRACE`; only source-level debugger
# attachment is lost. No coverage tooling in CI today needs debuginfo
# (verified: no llvm-cov / tarpaulin / grcov references in
# .github/workflows/ or .claude/scripts/). Paired with `.cargo/config.toml`
# wiring the mold linker for the real memory-and-time win.
[profile.test]
debug = 0

[workspace.package]
edition = "2024"
license = "Apache-2.0"
# version-0-3-0-bumped-cohort-a-v03: bumped 2026-05-09 for cohort-A v0.3.0 ship
version = "0.3.0"

[workspace.dependencies]
blake3 = "1"
sha2 = "0.11"
toml = "1.0"
# toml_edit_dependency_landed — implementation-note-7.
# Comment- + field-order-preserving TOML round-trip. Consumed by
# `headless-runtime::tasks::index` to fix the serializer-side-effects bug
# tracked by implementation-note-8
# (slice B does the save() rewrite).
toml_edit = "0.22"
